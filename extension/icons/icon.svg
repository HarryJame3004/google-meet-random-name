<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Graduation Cap Top -->
  <path d="M64 30 L102 48 L64 66 L26 48 Z" fill="#ffffff" />
  
  <!-- Graduation Cap Underbody -->
  <path d="M42 56 L42 76 C42 86 86 86 86 76 L86 56 L64 67 Z" fill="#e0e7ff" />
  
  <!-- Tassel -->
  <path d="M96 52 L96 82 L92 84 L100 84 L96 82" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" fill="none" />
  <circle cx="96" cy="85" r="3" fill="#fbbf24" />

  <!-- Dice in center/bottom -->
  <rect x="44" y="66" width="40" height="40" rx="8" fill="#ffffff" filter="url(#shadow)" />
  <!-- Dice Dots (5 face) -->
  <circle cx="53" cy="75" r="3.5" fill="#2563eb" />
  <circle cx="75" cy="75" r="3.5" fill="#2563eb" />
  <circle cx="64" cy="86" r="3.5" fill="#ef4444" />
  <circle cx="53" cy="97" r="3.5" fill="#2563eb" />
  <circle cx="75" cy="97" r="3.5" fill="#2563eb" />
</svg>
